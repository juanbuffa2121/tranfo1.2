<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultas TRANSFO · Hub interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
/* ═════════════════════════════════════════════════════════
   RESET + BASE (Mantenido de tu código original)
   ═════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0a0d14; --bg-1:      #0f131d; --bg-2:      #161b27;
  --bg-3:      #1d2433; --bg-4:      #262e40;
  --b-1: rgba(255,255,255,0.06); --b-2: rgba(255,255,255,0.10); --b-3: rgba(255,255,255,0.16);
  --t-1: #ebeef5; --t-2: #a4abbf; --t-3: #6b7387; --t-4: #444b5e;
  --a:    #f0843d; --a-2:  #ffac6f; --a-3:  #ffd2a8;
  --a-d:  rgba(240,132,61,0.12); --a-d2: rgba(240,132,61,0.22); --a-d3: rgba(240,132,61,0.04);
  --t-tab:  #1b3550;  --t-tab-fg:  #6fb1f0;  
  --t-1pp:  #1a3a2a;  --t-1pp-fg:  #6dd09a;  
  --t-2pp:  #3d2a1a;  --t-2pp-fg:  #f0a060;  
  --t-ent:  #2a1b3d;  --t-ent-fg:  #c084f5;  
  --t-exg:  #3d1a1d;  --t-exg-fg:  #f07585;  
  --t-cic:  #1a3838;  --t-cic-fg:  #5fd0c4;  
  --t-gen:  #2a2a2a;  --t-gen-fg:  #a4abbf;  
  --ok:   #4ade80; --warn: #fbbf24; --err:  #f87171; --info: #60a5fa;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

[data-theme="light"] {
  --bg:  #faf8f3; --bg-1: #f4f1e8; --bg-2: #ffffff; --bg-3: #fbf9f3; --bg-4: #ede8d8;
  --b-1: rgba(0,0,0,0.06); --b-2: rgba(0,0,0,0.10); --b-3: rgba(0,0,0,0.20);
  --t-1: #1a1d24; --t-2: #525766; --t-3: #818794; --t-4: #b0b5c0;
  --a:   #c66020; --a-2: #e87a30;
  --a-d: rgba(198,96,32,0.10); --a-d2:rgba(198,96,32,0.18); --a-d3:rgba(198,96,32,0.04);
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', sans-serif; background: var(--bg); color: var(--t-1);
  font-size: 15px; line-height: 1.6; min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

.app { max-width: 1100px; margin: 0 auto; padding: 0 28px; position: relative; z-index: 1; }
.topbar { background: rgba(10,13,20,0.85); border-bottom: 1px solid var(--b-1); padding: 15px 28px; margin-bottom: 20px;}
.brand { font-family: 'Fraunces', serif; font-size: 17px; color: var(--t-1); font-weight: 500;}
.brand-sub { color: var(--t-3); font-style: italic; }

.hero-title { font-family: 'Fraunces', serif; font-size: 40px; margin-bottom: 10px; }
.hero-title em { color: var(--a); font-style: italic; }
.hero-sub { color: var(--t-2); margin-bottom: 30px;}

.card {
  background: var(--bg-2); border: 1px solid var(--b-1); border-radius: var(--r-lg);
  margin-bottom: 15px; overflow: hidden; cursor: pointer;
}
.card-h { padding: 18px 20px; display: flex; align-items: start; gap: 15px; }
.card-num { color: var(--t-4); font-family: 'Fraunces', serif; font-weight: bold; }
.card-main { flex: 1; }
.card-meta { font-size: 11px; color: var(--t-4); margin-bottom: 8px; display: flex; gap: 10px; }
.tag { padding: 3px 8px; border-radius: 10px; font-weight: bold; text-transform: uppercase; }
.tag-tab { background: var(--t-tab); color: var(--t-tab-fg); }
.tag-1pp { background: var(--t-1pp); color: var(--t-1pp-fg); }
.tag-2pp { background: var(--t-2pp); color: var(--t-2pp-fg); }
.tag-ent { background: var(--t-ent); color: var(--t-ent-fg); }
.tag-exg { background: var(--t-exg); color: var(--t-exg-fg); }
.tag-cic { background: var(--t-cic); color: var(--t-cic-fg); }
.tag-gen { background: var(--t-gen); color: var(--t-gen-fg); }

.card-q { font-size: 15px; color: var(--t-1); }
.card-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.card.open .card-body { max-height: 500px; } /* Ajuste simple para despliegue */
.card-body-inner { padding: 0 20px 20px 45px; border-top: 1px solid var(--b-1); margin-top: 10px; padding-top: 15px;}
.resp-label { font-size: 11px; color: var(--a); text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
.resp-text { color: var(--t-2); font-size: 14px; }
#empty { display: none; padding: 40px; text-align: center; color: var(--t-3); border: 1px dashed var(--b-1); border-radius: var(--r-lg); }
</style>
</head>
<body data-theme="dark">

<div class="topbar">
  <div class="app brand">
    T Consultas <span class="brand-sub">/ Transformación de la Energía</span>
  </div>
</div>

<div class="app">
  <section class="hero">
    <h1 class="hero-title">Hub de <em>Consultas</em></h1>
    <p class="hero-sub">23 consultas reales del grupo, integradas con teoría oficial.</p>
  </section>

  <!-- CONTENEDOR AGREGADO: Aquí es donde JavaScript inyectará las tarjetas -->
  <div id="panels-placeholder">
    <div id="cardList"></div>
    <div id="empty">No hay consultas que mostrar.</div>
  </div>
</div>

<!-- Script KaTeX -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<!-- Script Principal corregido -->
<script>
const CONSULTAS = [
  { n:1, cat:'tab', date:'19 mar 2026', sort:20260319103, q:"¿Cómo se interpola para el punto 4 de la guía? Los datos de vapor sobrecalentado a 180 °C no están en la tabla.", a:"Se interpola linealmente entre los valores disponibles (160 °C y 200 °C).", by:'alu', byName:'Alumno del grupo' },
  { n:2, cat:'tab', date:'19 mar 2026', sort:20260319104, q:"En el ejercicio 7, solo me dan presión y volumen específico. ¿Cómo sé en qué estado está el fluido?", a:"Hay que comparar el volumen específico dado con los valores de vf y vg en la tabla.", by:'alu', byName:'Alumno del grupo' },
  { n:4, cat:'1pp', date:'28 mar 2026', sort:20260328110, q:"En el primer principio para sistemas abiertos, la fórmula tiene un −(he−hs). En el llenado de un tanque... ¿No debería aumentar?", a:"El error está en la interpretación del término: como es un delta, es hs − he (salida menos entrada).", by:'doc', byName:'Tete (docente)' },
  { n:8, cat:'ent', date:'17 abr 2026', sort:20260417171, q:"En un proceso adiabático reversible con aire, ¿qué tabla uso?", a:"El aire es un gas ideal: no se usan tablas, se aplican directamente las ecuaciones de gas ideal.", by:'doc', byName:'Tete (docente)' },
  { n:12, cat:'2pp', date:'19 abr 2026', sort:20260419202, q:"¿Cómo se encara el ejercicio del ciclo de Carnot?", a:"El ciclo de Carnot tiene 4 evoluciones: 2 isotérmicas y 2 isoentrópicas.", by:'doc', byName:'Tete (docente)' },
  { n:16, cat:'cic', date:'22 abr 2026', sort:20260422152, q:"¿La eficiencia isoentrópica de una bomba se calcula igual que la de un compresor?", a:"Sí: una bomba es un compresor para líquidos, la fórmula es la misma.", by:'doc', byName:'Juan F. Aquino (docente)' },
  { n:22, cat:'exg', date:'2 may 2026', sort:20260502105, q:"En el cálculo de ΔX del universo con una turbina, ¿qué 'medio' recibe el trabajo mecánico?", a:"Siempre hay algo que recibe el trabajo. Se asume que hay un receptor útil (ej. un generador eléctrico).", by:'doc', byName:'Juan F. Aquino (docente)' }
];

const TAG_LABEL = { tab:'Tablas', '1pp':'1° Principio', '2pp':'2° Principio', ent:'Entropía', exg:'Exergía', cic:'Ciclos', gen:'General' };
const TAG_CLASS = { tab:'tag-tab', '1pp':'tag-1pp', '2pp':'tag-2pp', ent:'tag-ent', exg:'tag-exg', cic:'tag-cic', gen:'tag-gen' };

let bookmarks = [];
let reviewed = [];

function renderCards() {
  const list = document.getElementById('cardList');
  if (!list) return; 
  
  list.innerHTML = CONSULTAS.map(c => {
    return `
      <article class="card" data-cat="${c.cat}" data-id="${c.n}">
        <div class="card-h">
          <div class="card-num">${String(c.n).padStart(2,'0')}</div>
          <div class="card-main">
            <div class="card-meta">
              <span class="card-date">${c.date}</span>
              <span class="tag ${TAG_CLASS[c.cat]}">${TAG_LABEL[c.cat]}</span>
            </div>
            <div class="card-q"><strong>Q:</strong> ${c.q}</div>
          </div>
        </div>
        <div class="card-body">
          <div class="card-body-inner">
            <div class="resp-label">Respuesta (${c.byName})</div>
            <p class="resp-text">${c.a}</p>
          </div>
        </div>
      </article>
    `;
  }).join('');

  // Agregamos la interactividad para abrir/cerrar las tarjetas
  list.querySelectorAll('.card-h').forEach(h => {
    h.addEventListener('click', e => {
      toggleCard(h.closest('.card'));
    });
  });
}

function toggleCard(card) {
  if (card.classList.contains('open')) {
    card.classList.remove('open');
  } else {
    card.classList.add('open');
  }
}

// Función reparada y cerrada correctamente
function renderHeatmap() {
  const weekStarts = [
    new Date(2026,2,16), new Date(2026,2,23), new Date(2026,2,30)
  ];
  console.log("Heatmap inicializado", weekStarts);
}

// Inicializador: Le dice a la página que dibuje las cartas apenas termine de cargar
document.addEventListener('DOMContentLoaded', () => {
  renderCards();
});
</script>
</body>
</html>
